name: relays

on:
  push:
    branches: [main]
    paths-ignore: ["assets/**", "site/**", "verification/**", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push supersedes an older run instead of both spending minutes. Scheduled and manual
# runs keep their own group, so a push never cancels the weekly Windows run.
concurrency:
  group: relays-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # Windows runners bill at twice the Linux rate on a private repo, so pushes to main
        # run Linux only; pull requests, the weekly schedule and manual runs add Windows.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node tools/build.mjs --check
      - run: node --test test/core.test.mjs test/engine.test.mjs
      - run: node test/relay-isolated.mjs
      - run: node test/docs-consistency.mjs
      - run: node test/event-scanner.mjs
      - run: node --test test/queue.test.mjs
      # Modules are isolated, so Linux runs them in parallel; Windows stays serial
      # until its timing under load is measured.
      - run: node test/relay-smoke.mjs ${{ runner.os == 'Linux' && '--jobs 4' || '' }}
      - name: validate the skills package
        if: runner.os == 'Linux'
        run: npx -y skills add . --list

  windows-node24-preflight:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node test/relay-smoke.mjs --only preflight,setup
